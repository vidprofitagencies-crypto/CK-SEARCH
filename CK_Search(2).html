<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#082b8a">
<title>CK+Search — Search, Browse & Discover</title>
<style>
:root{--bg:#082b8a;--panel:#103aa8;--panel2:#1748c4;--line:#5275ce;--text:#ffffff;--muted:#d7e3ff;--accent:#ffd54a;--accent2:#8fc5ff;--danger:#ff9ba8;--shadow:0 18px 50px #00164f66}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#3768dc 0,transparent 38%),linear-gradient(145deg,#06236f,#123fae 58%,#082b8a);color:var(--text);font:17px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer}.app{max-width:1500px;margin:auto;min-height:100vh;padding:14px}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 4px 16px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:24px;letter-spacing:-.8px;white-space:nowrap}.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#071522;font-weight:950;font-size:20px;box-shadow:0 8px 25px #ffd54a55}.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:1.8px;font-weight:700;margin-top:-4px}.top-actions{margin-left:auto;display:flex;gap:8px}.iconbtn,.ghost,.primary,.tab{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:9px 12px}.iconbtn{width:40px;height:40px;padding:0;font-size:17px}.iconbtn:hover,.ghost:hover,.tab:hover{border-color:var(--accent);background:var(--panel2)}.primary{font-size:16px;background:linear-gradient(110deg,var(--accent),#8de7d3);color:#071522;border:0;font-weight:800;padding:12px 19px}.primary:hover{filter:brightness(1.06)}.tabs{display:flex;align-items:center;gap:7px;overflow:auto;padding:0 2px 10px;border-bottom:1px solid var(--line)}.tab{font-size:15px;padding:10px 14px;white-space:nowrap;color:var(--muted);display:flex;gap:10px;align-items:center}.tab.active{background:#1a3445;border-color:#3d9c91;color:var(--text)}.tab .x{font-size:16px;color:var(--muted);padding-left:3px}.addtab{border:1px dashed #49607c;background:transparent;color:var(--muted);border-radius:11px;width:36px;height:36px;font-size:20px;flex:none}
.toolbar{display:flex;gap:8px;align-items:center;margin:14px 0 18px}.navbuttons{display:flex;gap:5px}.navbuttons button{width:36px;height:40px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px}.address-wrap{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:#092b80;border:1px solid #8aa8f2;border-radius:13px;padding:0 12px}.address-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #55d6be18}.lock{color:var(--accent)}#address{width:100%;min-width:0;background:transparent;border:0;outline:0;color:var(--text);padding:12px 0}.toolbar .iconbtn{flex:none}.main{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}.sidebar{background:#0b328f;border:1px solid var(--line);border-radius:18px;padding:13px;height:max-content;position:sticky;top:12px}.side-title{font-size:13px;color:#d0ddff;text-transform:uppercase;letter-spacing:1.5px;font-weight:800;padding:10px 9px 6px}.sideitem{font-size:15px;display:flex;align-items:center;gap:11px;width:100%;padding:10px;border:0;background:transparent;color:var(--muted);border-radius:10px;text-align:left}.sideitem:hover,.sideitem.active{background:#1b2c43;color:var(--text)}.sideitem span:first-child{width:20px;text-align:center}.sidebottom{border-top:1px solid var(--line);margin-top:14px;padding-top:10px;color:var(--muted);font-size:12px}.content{min-width:0}.hero{padding:clamp(24px,6vw,66px) 18px 28px;text-align:center;border:1px solid #2d4860;border-radius:24px;background:radial-gradient(ellipse at 50% 0%,#4778e8,transparent 65%),linear-gradient(145deg,#1748bd,#092b80);box-shadow:var(--shadow)}.hero-mark{font-size:clamp(35px,6vw,58px);font-weight:900;letter-spacing:-3px;line-height:1.05}.hero-mark span{color:var(--accent)}.hero p{color:var(--muted);margin:12px 0 25px}.searchbox{max-width:720px;margin:auto;display:flex;align-items:center;gap:10px;background:#f7fbff;border-radius:17px;padding:6px 7px 6px 17px;box-shadow:0 12px 30px #0004}.searchbox .glass{color:#60738d;font-size:20px}.searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#142238;padding:11px 0;font-size:19px}.searchbox button{border:0;border-radius:12px;background:#12283b;color:#fff;padding:11px 18px;font-weight:800}.search-hints{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}.hint{font-size:14px;color:#b4c4d9;border:1px solid #344c66;border-radius:30px;padding:5px 10px;background:#14243a}.section-head{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 12px}.section-head h2{font-size:19px;margin:0}.section-head span{font-size:14px;color:var(--muted)}.shortcuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.shortcut{display:flex;align-items:center;gap:11px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--text);text-decoration:none;min-width:0;transition:.18s}.shortcut:hover{transform:translateY(-2px);border-color:#4d9f99}.shortcut .fav{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#20334b;font-size:17px;flex:none}.shortcut b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis}.shortcut small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.feature{background:linear-gradient(145deg,#1746b6,#0b2e86);border:1px solid var(--line);padding:17px;border-radius:16px}.feature .ficon{font-size:22px}.feature h3{font-size:17px;margin:9px 0 4px}.feature p{font-size:14px;color:var(--muted);margin:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:14px}.panel h2{font-size:20px;margin:0 0 5px}.muted{color:var(--muted)}.list{display:grid;gap:8px;margin-top:14px}.listrow{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px}.listrow .rowmain{flex:1;min-width:0}.listrow b{display:block;font-size:13px;overflow-wrap:anywhere}.listrow small{color:var(--muted);font-size:11px}.listrow button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:6px 9px}.empty{text-align:center;color:var(--muted);padding:35px 10px}.footer{text-align:center;color:#71839c;font-size:13px;padding:24px 5px 12px}.notice{display:none;padding:10px 13px;border:1px solid #397e76;background:#15352f;color:#baf4e6;border-radius:11px;margin:0 0 12px;font-size:13px}.notice.show{display:block}.mobile-menu{display:none}.modalback{position:fixed;inset:0;background:#030812bb;display:none;place-items:center;padding:18px;z-index:10}.modalback.open{display:grid}.modal{max-width:460px;width:100%;background:#123b9e;border:1px solid #8aa8f2;border-radius:18px;padding:21px;box-shadow:var(--shadow)}.modal h2{margin:0 0 8px}.modal p{color:var(--muted);font-size:13px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.settingrow{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.settingrow:last-child{border:0}
.social-links{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.social-link{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:15px 8px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#1748bd,#0b2e86);color:#fff;text-decoration:none;transition:transform .18s,border-color .18s,box-shadow .18s}.social-link:hover{transform:translateY(-4px);border-color:#ffe06a;box-shadow:0 10px 24px #00164f66}.social-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:25px;font-weight:900;color:white;background:#ffffff20}.social-link b{font-size:14px}.fb{background:#1877f2}.ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}.yt{background:#ff0033}.wa{background:#1dbf65}.tt{background:#111}.li{background:#0a66c2}
@media(max-width:850px){.main{grid-template-columns:1fr}.sidebar{position:static;display:flex;gap:5px;overflow:auto;padding:7px}.side-title,.sidebottom{display:none}.sideitem{width:auto;white-space:nowrap;padding:9px 12px}.sideitem span:first-child{width:auto}.shortcuts{grid-template-columns:repeat(2,minmax(0,1fr))}.feature-grid{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.social-links{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){.app{padding:9px}.topbar{padding-bottom:10px}.brand{font-size:18px}.top-actions .hide-mobile{display:none}.toolbar{gap:5px}.navbuttons{gap:3px}.navbuttons button{width:31px}.toolbar>.iconbtn{width:35px}.hero{padding:34px 12px 23px;border-radius:19px}.hero-mark{letter-spacing:-2px}.searchbox{gap:7px;padding-left:12px}.searchbox button{padding:11px 13px}.shortcuts{gap:8px}.shortcut{padding:10px;gap:8px}.shortcut .fav{width:30px;height:30px}.feature-grid{grid-template-columns:1fr}.section-head{margin-top:20px}.tabs{padding-bottom:8px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">CK+</div><div>CK+Search<small>BROWSE • SEARCH • DISCOVER</small></div></div>
  <div class="top-actions">
    <button class="iconbtn hide-mobile" title="Bookmarks" onclick="showPage('bookmarks')">☆</button>
    <button class="iconbtn hide-mobile" title="History" onclick="showPage('history')">◷</button>
    <button class="iconbtn" title="Settings" onclick="openSettings()">⚙</button>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<div class="toolbar">
  <div class="navbuttons">
    <button title="Back" onclick="goBack()">‹</button><button title="Forward" onclick="goForward()">›</button><button title="Home" onclick="showHome()">⌂</button>
  </div>
  <div class="address-wrap"><span class="lock">⌕</span><input id="address" placeholder="Search Google or enter a website address" autocomplete="off" onkeydown="if(event.key==='Enter')navigateFromBar()"><button class="iconbtn" style="width:30px;height:30px;border:0;background:transparent" title="Bookmark current page" onclick="bookmarkCurrent()">☆</button></div>
  <button class="iconbtn" title="New tab" onclick="newTab()">＋</button>
</div>
<div class="notice" id="notice"></div>
<div class="main">
  <aside class="sidebar">
    <div class="side-title">Workspace</div>
    <button class="sideitem active" data-page="home" onclick="showPage('home')"><span>⌂</span> Home</button>
    <button class="sideitem" data-page="bookmarks" onclick="showPage('bookmarks')"><span>☆</span> Bookmarks</button>
    <button class="sideitem" data-page="history" onclick="showPage('history')"><span>◷</span> History</button>
    <button class="sideitem" data-page="downloads" onclick="showPage('downloads')"><span>⇩</span> Downloads</button>
    <button class="sideitem" onclick="openSettings()"><span>⚙</span> Settings</button>
    <div class="sidebottom">Your browsing workspace</div>
  </aside>
  <main class="content" id="content"></main>
</div>
<div class="footer">© Corneille Wacu 2027 · CK+Search · Search powered by Google.</div>
</div>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()">
 <div class="modal" id="modal"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{return JSON.parse(localStorage.getItem('ck_'+k))??d}catch{return d}},set(k,v){localStorage.setItem('ck_'+k,JSON.stringify(v))}};
let tabs=[{id:1,title:'New tab',url:'',page:'home'}],active=1,nextId=2,history=store.get('history',[]),bookmarks=store.get('bookmarks',[]),downloads=store.get('downloads',[]);
function current(){return tabs.find(t=>t.id===active)}
function renderTabs(){ $('#tabs').innerHTML=tabs.map(t=>`<button class="tab ${t.id===active?'active':''}" onclick="switchTab(${t.id})"><span>◉</span>${escapeHTML(t.title)}<span class="x" onclick="event.stopPropagation();closeTab(${t.id})">×</span></button>`).join('')+`<button class="addtab" onclick="newTab()">+</button>`}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(msg){let n=$('#notice');n.textContent=msg;n.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>n.classList.remove('show'),3600)}
function switchTab(id){active=id;renderTabs();renderPage()}
function newTab(){let id=nextId++;tabs.push({id,title:'New tab',url:'',page:'home'});switchTab(id)}
function closeTab(id){if(tabs.length===1){tabs[0]={id:tabs[0].id,title:'New tab',url:'',page:'home'};switchTab(tabs[0].id);return}tabs=tabs.filter(t=>t.id!==id);if(active===id)active=tabs[tabs.length-1].id;renderTabs();renderPage()}
function showHome(){let t=current();t.title='New tab';t.url='';t.page='home';renderTabs();renderPage()}
function showPage(page){let t=current();t.page=page;t.url='';t.title=page[0].toUpperCase()+page.slice(1);renderTabs();renderPage();document.querySelectorAll('.sideitem').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function search(q){q=q.trim();if(!q)return;let url='https://www.google.com/search?q='+encodeURIComponent(q);openExternal(url,q,'search')}
function normalizeUrl(value){let v=value.trim();if(!v)return '';if(/\s/.test(v)||(!v.includes('.')&&!v.startsWith('http')))return 'https://www.google.com/search?q='+encodeURIComponent(v);if(!/^https?:\/\//i.test(v))v='https://'+v;try{return new URL(v).href}catch{return 'https://www.google.com/search?q='+encodeURIComponent(value)}}
function navigateFromBar(){let raw=$('#address').value.trim();if(!raw)return;let url=normalizeUrl(raw);let title=raw.replace(/^https?:\/\//,'').split('/')[0];openExternal(url,title,'site')}
function openExternal(url,title,kind='site'){let t=current();t.url=url;t.title=(title||'Page').slice(0,22);t.page='external';let item={url,title:title||url,kind,time:new Date().toISOString()};history.unshift(item);history=history.slice(0,250);store.set('history',history);renderTabs();renderPage();$('#address').value=url;let w=window.open(url,'_blank','noopener');if(!w)notify('Your browser blocked the new tab. Allow pop-ups for this file, or copy the address from the address bar.');else notify('Opened in a new browser tab. CK+Search keeps your browsing shortcut here.')}
function goBack(){if(history.length>1){let item=history[1];$('#address').value=item.url;notify('Use your browser tab’s Back button to go back on the external page.')}}function goForward(){notify('Forward navigation is handled by the browser tab opened for the website.')}
function bookmarkCurrent(){let t=current();if(!t.url){notify('Search for a website first, then bookmark it.');return}if(bookmarks.some(b=>b.url===t.url)){notify('This page is already bookmarked.');return}bookmarks.unshift({url:t.url,title:t.title});store.set('bookmarks',bookmarks);notify('Bookmark added.')}
function openSaved(url,title){openExternal(url,title,'site')}
function renderPage(){let t=current();$('#address').value=t.url||'';document.querySelectorAll('.sideitem').forEach(b=>b.classList.toggle('active',b.dataset.page===t.page));let c=$('#content');if(t.page==='home'||!t.page){c.innerHTML=homeHTML();return}if(t.page==='bookmarks'){c.innerHTML=listHTML('Your bookmarks','Your saved websites.',bookmarks,'bookmark');return}if(t.page==='history'){c.innerHTML=listHTML('Browsing history','Your recent searches and visited websites.',history,'history');return}if(t.page==='downloads'){c.innerHTML=`<section class="panel"><h2>Downloads</h2><p class="muted">Your browser manages files downloaded from websites.</p><div class="empty">⇩<br>No downloads recorded by CK+Search yet.</div></section>`;return}if(t.page==='external'){c.innerHTML=`<section class="panel"><h2>Website opened</h2><p class="muted">Websites open securely in a separate browser tab.</p><div class="listrow"><span>🌐</span><div class="rowmain"><b>${escapeHTML(t.title)}</b><small>${escapeHTML(t.url)}</small></div><button onclick="window.open('${escapeHTML(t.url)}','_blank','noopener')">Open again ↗</button></div><p class="muted" style="font-size:12px;margin-top:15px">Use the browser controls in your device to manage the page you opened.</p></section>`;return}}
function homeHTML(){return `<section class="hero"><div class="hero-mark">CK<span>+</span>Search</div><p>One simple place to search the web and open your favourite websites.</p><form class="searchbox" onsubmit="event.preventDefault();search($('#mainSearch').value)"><span class="glass">⌕</span><input id="mainSearch" placeholder="What do you want to discover today?" aria-label="Search the web"><button type="submit">Search</button></form><div class="search-hints"><span class="hint">Web search</span><span class="hint">Quick access</span><span class="hint">Bookmarks</span></div></section><div class="section-head"><h2>Quick access</h2><span>Open a website</span></div><div class="shortcuts">${[['G','Google','google.com','https://www.google.com'],['▶','YouTube','youtube.com','https://www.youtube.com'],['W','Wikipedia','wikipedia.org','https://www.wikipedia.org'],['✉','Gmail','mail.google.com','https://mail.google.com'],['f','Facebook','facebook.com','https://www.facebook.com'],['𝕏','X','x.com','https://x.com'],['in','LinkedIn','linkedin.com','https://www.linkedin.com'],['GH','GitHub','github.com','https://github.com']].map(a=>`<a href="${a[3]}" class="shortcut" onclick="event.preventDefault();openExternal('${a[3]}','${a[1]}')"><span class="fav">${a[0]}</span><span><b>${a[1]}</b><small>${a[2]}</small></span></a>`).join('')}</div><div class="section-head"><h2>Connect &amp; explore</h2><span>Social platforms</span></div><div class="social-links"><a class="social-link" href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Facebook"><span class="social-icon fb">f</span><b>Facebook</b></a><a class="social-link" href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram"><span class="social-icon ig">◎</span><b>Instagram</b></a><a class="social-link" href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="YouTube"><span class="social-icon yt">▶</span><b>YouTube</b></a><a class="social-link" href="https://www.whatsapp.com/" target="_blank" rel="noopener" aria-label="WhatsApp"><span class="social-icon wa">◉</span><b>WhatsApp</b></a><a class="social-link" href="https://www.tiktok.com/" target="_blank" rel="noopener" aria-label="TikTok"><span class="social-icon tt">♪</span><b>TikTok</b></a><a class="social-link" href="https://www.linkedin.com/" target="_blank" rel="noopener" aria-label="LinkedIn"><span class="social-icon li">in</span><b>LinkedIn</b></a></div><div class="section-head"><h2>Explore CK+Search</h2><span>Tools for your browsing</span></div><div class="feature-grid"><div class="feature"><div class="ficon">⌕</div><h3>Web search</h3><p>Search the web with Google and explore relevant results.</p></div><div class="feature"><div class="ficon">☆</div><h3>Bookmarks</h3><p>Keep your favourite websites close at hand.</p></div><div class="feature"><div class="ficon">◷</div><h3>Recent history</h3><p>Quickly revisit searches and websites opened from CK+Search.</p></div></div>`}
function listHTML(title,desc,items,type){let rows=items.map((x,i)=>`<div class="listrow"><span>${type==='bookmark'?'☆':'◷'}</span><div class="rowmain"><b>${escapeHTML(x.title||x.url)}</b><small>${escapeHTML(x.url)}${x.time?' · '+new Date(x.time).toLocaleString():''}</small></div><button onclick="openSaved('${escapeHTML(x.url)}','${escapeHTML(x.title||'Website')}')">Open ↗</button><button onclick="removeItem('${type}',${i})">×</button></div>`).join('');return `<section class="panel"><h2>${title}</h2><p class="muted">${desc}</p>${items.length?`<div class="list">${rows}</div>`:`<div class="empty">Nothing here yet.</div>`}<div style="display:flex;justify-content:flex-end;margin-top:13px"><button class="ghost" onclick="clearList('${type}')">Clear ${type}</button></div></section>`}
function removeItem(type,i){if(type==='bookmark'){bookmarks.splice(i,1);store.set('bookmarks',bookmarks)}else{history.splice(i,1);store.set('history',history)}renderPage()}
function clearList(type){if(!confirm('Clear all '+type+' items?'))return;if(type==='bookmark'){bookmarks=[];store.set('bookmarks',bookmarks)}else{history=[];store.set('history',history)}renderPage()}
function openSettings(){$('#modal').innerHTML=`<h2>CK+Search settings</h2><p>Personalise your CK+Search experience.</p><div class="settingrow"><span>Search provider</span><b>Google</b></div><div class="settingrow"><span>Clear saved data</span><button class="ghost" onclick="clearAll()">Clear</button></div><p>Searches open Google results. Use the controls above to manage your browsing shortcuts.</p><div class="modal-actions"><button class="primary" onclick="closeModal()">Done</button></div>`;$('#modalback').classList.add('open')}
function clearAll(){if(!confirm('Clear CK+Search bookmarks and history?'))return;bookmarks=[];history=[];store.set('bookmarks',bookmarks);store.set('history',history);closeModal();showPage('home');notify('Your bookmarks and history have been cleared.')}
function closeModal(){$('#modalback').classList.remove('open')}
renderTabs();renderPage();
</script>
</body>
</html>
